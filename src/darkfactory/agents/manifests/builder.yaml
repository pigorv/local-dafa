identity:
  role: builder
  description: >-
    Single-generalist build-stage worker that implements one Work
    Package end-to-end across Java sources, Flyway/SQL migrations, and
    fixtures. Reads and writes via the SDK's built-in file tools and
    shells out through the built-in ``Bash`` tool. Never edits anything
    under ``src/test/...`` — that belongs to Tester.
  when_to_use: >-
    Inside the build subgraph, per Work Package in topo order, before
    Tester writes assertions and before the verify sweep runs.

llm:
  model: claude-sonnet-4-5-20250929
  thinking:
    enabled: false
  prompt_path: prompts/builder.md
  prompt_as_user_message: true
  structured_output: schemas/builder_output.json

tools:
  allowed:
    - Read
    - Write
    - Edit
    - Grep
    - Glob
    - Bash
    - Skill
  disallowed: []
  # Pure denylist policy: the worker container is the isolation
  # boundary, so the gate runs only the global denies (FORBIDDEN_TOKENS,
  # gh-pr-merge prefix, role-owned prefixes such as ``git push`` owned
  # by pr_creator) plus this manifest's argv_denylist. An empty
  # argv_allowlist disables the per-role allowlist check.
  argv_allowlist: []
  argv_denylist:
    - [git, push]
  role_owned_argv_prefixes: []
  edit_path_allowlist: []

mcp: []

hooks:
  - event: PreToolUse
    name: loop_breaker
    parameters: {}
  - event: PreToolUse
    name: call_cap
    parameters:
      max_turns: 150
  - event: PreToolUse
    name: heartbeat
    parameters:
      detail: "builder: pre tool"
  - event: PostToolUse
    name: prompt_injection_guard
    parameters: {}
  - event: PostToolUse
    name: heartbeat
    parameters:
      detail: "builder: post tool"
  - event: Stop
    name: heartbeat
    parameters:
      detail: "builder: turn boundary"

budgets:
  retry_caps: {}
