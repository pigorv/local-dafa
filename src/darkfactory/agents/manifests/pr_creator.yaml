identity:
  role: pr_creator
  description: >-
    PR publication role. Finds the workflow's existing pull request or
    creates a new one with the approved spec, verification summary, and
    push of the feature branch.
  when_to_use: >-
    Inside the workflow's pr_creator_stage, after build and verify
    converge on a green state and before the final Reviewer pass and the
    human merge gate.

llm:
  model: claude-haiku-4-5-20251001
  thinking:
    enabled: false
  prompt_path: prompts/pr_creator.md

tools:
  allowed:
    - Read
    - Grep
    - Glob
    - sandbox_bash
  disallowed: []
  argv_allowlist:
    - git
    - gh
    - cat
    - ls
  role_owned_argv_prefixes:
    - [gh, pr, create]
    - [gh, pr, list]
    - [git, push]
  edit_path_allowlist: []

mcp:
  - darkfactory

hooks:
  - event: PreToolUse
    name: loop_breaker
    parameters: {}
  - event: PreToolUse
    name: call_cap
    parameters: {}
  - event: PreToolUse
    name: heartbeat
    parameters:
      detail: "pr_creator: pre tool"
  - event: PostToolUse
    name: prompt_injection_guard
    parameters: {}
  - event: PostToolUse
    name: heartbeat
    parameters:
      detail: "pr_creator: post tool"
  - event: UserPromptSubmit
    name: goal_pin
    parameters: {}
  - event: Stop
    name: heartbeat
    parameters:
      detail: "pr_creator: turn boundary"

budgets:
  retry_caps: {}
