identity:
  role: triage
  description: >-
    Reasoning-only triage role that decides whether a labeled GitHub
    issue is ready for Dark Factory to build or needs clarification
    questions back to the author.
  when_to_use: >-
    First step of the issue-driven workflow, before discovery.
    Consumes the issue title/body/comments plus repo context; emits
    ready_to_build + clarification_questions or derived_user_request.

llm:
  model: claude-haiku-4-5-20251001
  thinking:
    enabled: false
  prompt_path: prompts/triage.md
  prompt_as_user_message: true
  structured_output: schemas/triage_output.json

tools:
  allowed:
    - Read
    - Grep
    - Glob
    - Skill
  disallowed:
    - Bash
    - Edit
    - Write
  argv_allowlist: []
  role_owned_argv_prefixes: []
  edit_path_allowlist: []

mcp: []

hooks:
  - event: PreToolUse
    name: loop_breaker
    parameters: {}
  - event: PreToolUse
    name: call_cap
    parameters: {}
  - event: PreToolUse
    name: heartbeat
    parameters:
      detail: "triage: pre tool"
  - event: PostToolUse
    name: prompt_injection_guard
    parameters: {}
  - event: PostToolUse
    name: structured_output_hint
    parameters: {}
  - event: PostToolUse
    name: heartbeat
    parameters:
      detail: "triage: post tool"
  - event: Stop
    name: heartbeat
    parameters:
      detail: "triage: turn boundary"

budgets:
  retry_caps: {}
