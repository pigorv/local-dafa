identity:
  role: pr_creator
  description: >-
    PR publication role. Pushes the feature branch and opens the pull
    request for an approved workflow. Idempotency (existing-PR check)
    is handled deterministically by the activity wrapper, so this role
    only runs when no PR exists yet.
  when_to_use: >-
    Inside the workflow's pr_creator_stage, after build and verify
    converge on a green state and before the final Reviewer pass and the
    human merge gate.

llm:
  model: claude-haiku-4-5-20251001
  thinking:
    enabled: false
  prompt_path: prompts/pr_creator.md
  prompt_as_user_message: true
  structured_output: schemas/pr_creator_output.json

tools:
  allowed:
    - Read
    - Grep
    - Glob
  disallowed: []
  # Built-in Bash, argv-gated by hooks/permission_gate.py. Unlike the
  # Builder/Tester/Fixer pure-denylist policy, this publishing role keeps
  # a tight allowlist: only `git` and `gh` binaries, with `gh issue`
  # subcommands denied (the workflow owns the issue label lifecycle) and
  # `gh pr merge` denied globally. `git push` / `gh pr create` / `gh pr
  # list` are role-owned by pr_creator.
  argv_allowlist:
    - git
    - gh
  argv_denylist:
    - [gh, issue]
  role_owned_argv_prefixes:
    - [gh, pr, create]
    - [gh, pr, list]
    - [git, push]
  edit_path_allowlist: []

mcp: []

hooks:
  - event: PreToolUse
    name: loop_breaker
    parameters: {}
  - event: PreToolUse
    name: call_cap
    parameters: {}
  - event: PreToolUse
    name: heartbeat
    parameters:
      detail: "pr_creator: pre tool"
  - event: PostToolUse
    name: prompt_injection_guard
    parameters: {}
  - event: PostToolUse
    name: structured_output_hint
    parameters: {}
  - event: PostToolUse
    name: heartbeat
    parameters:
      detail: "pr_creator: post tool"
  - event: Stop
    name: heartbeat
    parameters:
      detail: "pr_creator: turn boundary"

budgets:
  retry_caps: {}
