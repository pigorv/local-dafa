identity:
  role: plan_critic
  description: >-
    Reasoning-only critic that reviews the Architect's work packages
    against the original user stories and either approves the brief or
    returns targeted edits keyed by WorkPackage id.
  when_to_use: >-
    Inside the discovery subgraph after the Architect emits work
    packages, before the brief gate. Up to PLANNING_MAX_ATTEMPTS=5
    rejection cycles re-feed planning_feedback into the Architect.

llm:
  model: claude-sonnet-4-5-20250929
  thinking:
    enabled: false
  prompt_path: prompts/plan_critic.md
  prompt_as_user_message: true
  structured_output: schemas/plan_critic_output.json

tools:
  allowed: []
  disallowed: []
  argv_allowlist: []
  role_owned_argv_prefixes: []
  edit_path_allowlist: []

mcp: []

hooks:
  - event: PostToolUse
    name: structured_output_hint
    parameters: {}
  - event: Stop
    name: heartbeat
    parameters:
      detail: "plan_critic: turn boundary"

budgets:
  retry_caps: {}
