identity:
  role: fixer
  description: >-
    Bounded-repair role invoked when the verifier reports failing
    diagnostics. Reads the approved Implementation Brief, the verifier's
    ``predicate_coverage``, Tester findings, and (on a merge-gate fix)
    Reviewer findings, then emits a structured decision: ``fixed``
    when its edits repair the failure within the approved brief,
    ``needs_brief_change`` when the brief itself must be revised, or
    ``cannot_fix`` when repair is infeasible. File edits flow through
    SDK built-ins and the activity computes ground-truth patches from
    ``git diff`` after the run; per-WP + per-predicate budgets cap
    repair attempts.
  when_to_use: >-
    After ``verify_stage`` returns a non-passing ``VerifySummary``, inside
    the workflow's fixer/verify loop, until the budget cap is reached or
    the fixer escalates.

llm:
  model: claude-sonnet-4-5-20250929
  thinking:
    enabled: false
  prompt_path: prompts/fixer.md
  prompt_as_user_message: true
  structured_output: schemas/fixer_output.json

tools:
  allowed:
    - Read
    - Write
    - Edit
    - Grep
    - Glob
    - Bash
  disallowed: []
  # Pure denylist policy: the worker container is the isolation boundary,
  # so the gate runs only the global denies (FORBIDDEN_TOKENS, gh-pr-merge
  # prefix, role-owned prefixes such as ``git push`` owned by pr_creator)
  # plus this manifest's argv_denylist. An empty argv_allowlist disables
  # the per-role allowlist check. Mirrors the Builder / Tester pattern.
  argv_allowlist: []
  argv_denylist:
    - [git, push]
  role_owned_argv_prefixes: []
  edit_path_allowlist: []

mcp: []

hooks:
  - event: PreToolUse
    name: loop_breaker
    parameters: {}
  - event: PreToolUse
    name: call_cap
    parameters: {}
  - event: PreToolUse
    name: heartbeat
    parameters:
      detail: "fixer: pre tool"
  - event: PostToolUse
    name: prompt_injection_guard
    parameters: {}
  - event: PostToolUse
    name: structured_output_hint
    parameters: {}
  - event: PostToolUse
    name: heartbeat
    parameters:
      detail: "fixer: post tool"
  - event: Stop
    name: heartbeat
    parameters:
      detail: "fixer: turn boundary"

budgets:
  retry_caps: {}
