[project]
name = "darkfactory"
version = "0.1.0"
description = "Autonomous coding pipeline that turns developer requests and GitHub issues into reviewed pull requests."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.84.0",
    "claude-agent-sdk",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite",
    "langfuse>=4,<5",
    "docker",
    "gitpython",
    "tree-sitter",
    "grep-ast",
    "temporalio",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "openinference-instrumentation-langchain",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1",
]

[project.scripts]
darkfactory = "darkfactory.cli:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.23",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkfactory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker, external CLIs, or networked fixtures",
]
